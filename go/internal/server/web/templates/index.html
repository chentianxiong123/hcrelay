<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HomeCast Relay</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0a0b0e;--bg2:#0f1118;--card:#141720;--card2:#1a1e2a;
  --line:#222838;--fg:#e4e9f2;--dim:#5e6880;--dim2:#3a4358;
  --acc:#ff4d6d;--acc-soft:rgba(255,77,109,.12);--ok:#34d399;--warn:#fbbf24;
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  padding:0;max-width:500px;margin:0 auto;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── 主内容区（给底部 tab 留空间）── */
.main{padding:16px 16px 84px;min-height:100vh}

/* header */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),#ff8a5c);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hdr-t{flex:1;min-width:0}
.hdr-t h1{font-size:15px;font-weight:700}
.hdr-t .sub{font-size:10px;color:var(--dim);word-break:break-all;margin-top:1px}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.4s infinite;flex-shrink:0}
@keyframes blink{50%{opacity:.25}}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}
.card h2{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}

/* ── 资源嗅探 ── */
.sniffrow{display:flex;gap:8px;margin-bottom:8px}
.inp{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--fg);font-size:12px;outline:none;min-width:0}
.inp:focus{border-color:var(--acc)}
.sniffeps{font-size:11px;color:var(--dim)}
.eps{max-height:240px;overflow-y:auto}
.ep{display:flex;align-items:center;gap:7px;padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.ep:hover{background:var(--card2)}
.epi{width:22px;height:22px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.ept{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epu{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;font-size:10px}
.warn{color:#fbbf24}
.dim{color:var(--dim)}
.sres{max-height:240px;overflow-y:auto}
.sr{display:flex;flex-direction:column;gap:2px;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.sr:hover{background:var(--card2)}
.sr-t{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-u{color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-e{font-size:9px;color:var(--acc);font-weight:700;text-transform:uppercase}

/* page */
.page{display:none}
.page.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ── 大状态卡（首页）── */
.hero{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:12px}
.hero-ic{font-size:44px;margin-bottom:8px}
.hero-t{font-size:16px;font-weight:800;letter-spacing:-.01em}
.hero-s{font-size:11px;color:var(--dim);margin-top:4px}
.hero-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:10px}
.hero-badge.idle{background:var(--acc-soft);color:var(--acc)}
.hero-badge.live{background:rgba(52,211,153,.14);color:var(--ok)}

/* stat grid */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.si{background:var(--card2);border-radius:8px;padding:8px 10px;min-width:0}
.si .sl{font-size:9px;color:var(--dim2);font-weight:600;letter-spacing:.08em;margin-bottom:2px}
.si .sv{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .sv.dim{color:var(--dim)}.si .sv.ok{color:var(--ok)}.si .sv.warn{color:var(--warn)}
.si .sv.link{font-size:9px;color:var(--dim);word-break:break-all;white-space:normal;max-height:2em;overflow:hidden}

/* ── 操作台（大播放控制）── */
.dock{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;
}
.dock-cover{
  width:100%;aspect-ratio:16/9;border-radius:12px;margin-bottom:14px;
  background:linear-gradient(135deg,#1e2432,#141720);display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.dock-cover .cover-tv{font-size:52px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.dock-cover .cover-live{position:absolute;top:10px;left:10px;font-size:9px;font-weight:700;color:#fff;background:var(--acc);padding:2px 8px;border-radius:4px;letter-spacing:.05em}
.dock-title{font-size:15px;font-weight:800;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-sub{font-size:10px;color:var(--dim);margin-bottom:14px}

/* 大进度条 */
.bigseek{position:relative;padding:12px 0;cursor:pointer;touch-action:none}
.bigseek-track{height:8px;background:var(--line);border-radius:5px;position:relative}
.bigseek-fill{position:absolute;left:0;top:0;height:100%;background:var(--acc);border-radius:5px;width:0}
.bigseek-knob{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.bigseek.dragging .bigseek-knob{transform:translate(-50%,-50%) scale(1.3)}
.bigseek-time{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.bigseek-time .cur{color:var(--fg);font-weight:700}

/* 大控制按钮 */
.bigbtns{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 6px;height:auto}
.bbtn{
  width:52px;height:52px;min-height:0;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;user-select:none;flex-shrink:0;padding:0;line-height:1;
}
.bbtn:active{transform:scale(.9)}
.bbtn.main{width:64px;height:64px;font-size:26px;background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 20px rgba(255,77,109,.35)}
.bbtn.sm{width:42px;height:42px;font-size:15px}
.bbtn:hover{border-color:var(--dim)}

/* 音量（大） */
.bigvol{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.bigvol .vic{font-size:14px;width:20px;text-align:center}
.bigvol .vnum{font-size:11px;color:var(--dim);width:28px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range].vrange{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--line);outline:none;cursor:pointer}
input[type=range].vrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}
input[type=range].vrange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;cursor:pointer}

/* 操作台小按钮 */
.dock-meta{display:flex;gap:6px;margin-top:12px}
.dock-meta .dm{flex:1;font-size:10px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center}
.dock-meta .dm b{display:block;font-size:12px;color:var(--fg);margin-top:2px;font-variant-numeric:tabular-nums}

/* ── 设备气泡 ── */
.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 8px 10px;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;position:relative;user-select:none}
.bub:hover{border-color:var(--dim);transform:translateY(-1px)}
.bub.on{border-color:var(--acc);background:linear-gradient(180deg,rgba(255,77,109,.1),transparent);box-shadow:0 4px 16px rgba(255,77,109,.15)}
.bub .bub-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:7px;flex-shrink:0}
.bub .bub-ic.tv{background:rgba(96,165,250,.12)}
.bub.on .bub-ic.tv{background:rgba(255,77,109,.2)}
.bub .bub-ic.self{background:rgba(52,211,153,.1)}
.bub .bub-name{font-size:11px;font-weight:700;text-align:center;word-break:break-all;line-height:1.3}
.bub .bub-ip{font-size:9px;color:var(--dim2);margin-top:2px}
.bub .bub-tag{position:absolute;top:6px;right:8px;font-size:8px;font-weight:700;padding:1px 6px;border-radius:4px}
.bub .bub-tag.self{background:rgba(52,211,153,.15);color:var(--ok)}
.bub .bub-tag.on{background:var(--acc);color:#fff}
.bub-empty{grid-column:1/-1;font-size:11px;color:var(--dim2);text-align:center;padding:14px;background:var(--bg2);border-radius:9px;line-height:1.5}

/* btn */
.btn{border:0;border-radius:7px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--dim);display:block;width:100%;margin-top:8px}
.btn.gh:active{border-color:var(--dim);color:var(--fg)}
.btn.pri{background:var(--acc);color:#fff;border:0;padding:8px 16px}

/* err */
.errbar{margin-top:8px;padding:7px 10px;font-size:10px;color:var(--acc);background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.18);border-radius:7px;word-break:break-all}

/* logs */
.logs{font-family:"SF Mono",ui-monospace,monospace;font-size:9.5px;color:var(--dim2);max-height:300px;overflow-y:auto;background:var(--bg2);border-radius:8px;padding:8px 10px;line-height:1.7}
.logs div{white-space:pre-wrap;word-break:break-all}

/* toast */
#toast{min-height:15px;font-size:11px;text-align:center;margin-top:6px}
#toast .ok{color:var(--ok)}#toast .err{color:var(--acc)}

/* ── 底部导航 ── */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;
  background:rgba(12,13,16,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:10px;cursor:pointer;color:var(--dim);transition:all .15s;user-select:none}
.tab .ti{font-size:17px;line-height:1}
.tab .tt{font-size:9px;font-weight:700}
.tab.active{color:var(--acc)}
.tab.active .ti{transform:scale(1.1)}
.tab .tbadge{position:relative}
.tab .tbadge::after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--acc)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="main">
  <div class="hdr">
    <div class="logo">▶</div>
    <div class="hdr-t">
      <h1>HomeCast Relay</h1>
      <div class="sub" id="baseurl">{{.BaseURL}}</div>
    </div>
    <div class="hdr-dot" title="接收端在线"></div>
  </div>

  <!-- ═══════════ 首页 ═══════════ -->
  <div class="page active" id="page-home">
    <div class="hero">
      <div class="hero-ic" id="hero-ic">📡</div>
      <div class="hero-t" id="hero-t">等待投屏</div>
      <div class="hero-s" id="hero-s">打开 B站 App → 投屏 → 选「HomeCast Relay」</div>
      <span class="hero-badge idle" id="hero-badge">● 接收端在线</span>
    </div>

    <div class="card">
      <h2>实时状态</h2>
      <div class="sg">
        <div class="si"><div class="sl">目标电视</div><div class="sv warn" id="st-tv">未选择</div></div>
        <div class="si"><div class="sl">播放中</div><div class="sv dim" id="st-playing">—</div></div>
        <div class="si"><div class="sl">速度</div><div class="sv dim" id="st-speed">—</div></div>
      </div>
      <div id="errbar" class="errbar hidden">—</div>
    </div>

    <div class="card">
      <h2>资源搜索（bing/360/百度）</h2>
      <div class="sniffrow">
        <input class="inp" id="search-q" placeholder="搜盗版站，如：季节粤语 全集在线观看" >
        <button class="btn gh" onclick="searchSites()">搜索</button>
      </div>
      <div id="search-res" class="sniffeps"><div class="dim">搜索盗版站关键词，点结果自动提取集数。</div></div>
    </div>

    <div class="card">
      <h2>资源嗅探（盗版站集数）</h2>
      <div class="sniffrow">
        <input class="inp" id="sniff-url" placeholder="粘贴盗版站详情页 URL" type="url">
        <button class="btn gh" onclick="sniffURL()">提取集数</button>
      </div>
      <div id="sniff-eps" class="sniffeps"><div class="dim">输入盗版站详情页链接，提取每一集的播放地址。遇到 JS 反爬自动用 WebView 打开。</div></div>
    </div>
  </div>

  <!-- ═══════════ 操作台 ═══════════ -->
  <div class="page" id="page-dock">
    <div class="dock" id="dock">
      <div class="dock-cover">
        <div class="cover-tv">📺</div>
        <span class="cover-live" id="dock-live">LIVE</span>
      </div>
      <div class="dock-title" id="dock-title">未在播放</div>
      <div class="dock-sub" id="dock-sub">目标电视：—</div>

      <div class="bigseek" id="bigseek">
        <div class="bigseek-track">
          <div class="bigseek-fill" id="bigseek-fill"></div>
          <div class="bigseek-knob" id="bigseek-knob"></div>
        </div>
        <div class="bigseek-time">
          <span class="cur" id="d-cur">00:00</span>
          <span id="d-dur">00:00</span>
        </div>
      </div>

      <div class="bigbtns">
        <button class="bbtn main" id="d-play" onclick="togglePlay()" title="播放/暂停">▶</button>
      </div>

      <div class="bigvol">
        <span class="vic" id="d-vol-ic">🔊</span>
        <input type="range" class="vrange" id="d-vol" min="0" max="100" value="50"
          oninput="volPreview(this.value)" onchange="ctl('volume', this.value)">
        <span class="vnum" id="d-vol-num">50</span>
      </div>

      <div class="dock-meta">
        <div class="dm">传输<b id="d-bytes">0 B</b></div>
        <div class="dm">速度<b id="d-speed">0 KB/s</b></div>
        <div class="dm">位置<b id="d-pos">0%</b></div>
      </div>
    </div>
  </div>

  <!-- ═══════════ 设备 ═══════════ -->
  <div class="page" id="page-dev">
    <div class="card">
      <h2>设备</h2>
      <div class="bubbles" id="bubbles"><div class="bub-empty">加载中…</div></div>
      <button class="btn gh" onclick="rescan()">重新扫描</button>
      <div id="toast"></div>
    </div>
  </div>

  <!-- ═══════════ 日志 ═══════════ -->
  <div class="page" id="page-log">
    <div class="card">
      <h2>日志</h2>
      <div class="logs" id="logs"></div>
    </div>
  </div>
</div>

<!-- ═══════════ 底部导航 ═══════════ -->
<nav class="tabbar">
  <div class="tab active" data-page="home" onclick="goPage('home')"><span class="ti">🏠</span><span class="tt">首页</span></div>
  <div class="tab" data-page="dock" onclick="goPage('dock')"><span class="ti tbadge" id="tab-dock-ic">🎮</span><span class="tt">操作台</span></div>
  <div class="tab" data-page="dev" onclick="goPage('dev')"><span class="ti">📺</span><span class="tt">设备</span></div>
  <div class="tab" data-page="log" onclick="goPage('log')"><span class="ti">📜</span><span class="tt">日志</span></div>
</nav>

<script>
const SELF_NAME = "HomeCast Relay";

// ── 页面切换 ──
let curPage = 'home';
function goPage(p) {
  curPage = p;
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('active', x.id === 'page-'+p));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.page === p));
}

// ── toast ──
function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.innerHTML = '<span class="'+(ok?'ok':'err')+'">'+msg+'</span>';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.innerHTML=''; }, 3000);
}

// ── 资源搜索（bing/360/百度 聚合）──
async function searchSites() {
  const q = document.getElementById('search-q').value.trim();
  if(!q) { toast('请输入关键词', false); return; }
  const box = document.getElementById('search-res');
  box.innerHTML = '<div class="dim">搜索中…（bing → 360 → 百度）</div>';
  try {
    const r = await fetch('/api/search?q='+encodeURIComponent(q));
    const d = await r.json();
    if(d.ok) { renderSearchRes(box, d.results||[]); toast('搜到 '+(d.results||[]).length+' 条'); }
    else box.innerHTML = '<div class="warn">'+(d.msg||'搜索失败')+'</div>';
  } catch(e) { box.innerHTML = '<div class="warn">网络错误: '+e.message+'</div>'; }
}
function renderSearchRes(box, rs) {
  if(!rs.length) { box.innerHTML = '<div class="warn">无结果</div>'; return; }
  box.innerHTML = '<div class="sres">'+rs.map(r=>
    '<div class="sr" onclick="pickSite(\''+r.url.replace(/'/g,"\\'")+'\')">'+
    '<span class="sr-t">'+(r.title||r.url)+'</span>'+
    '<span class="sr-u">'+r.url+'</span>'+
    '<span class="sr-e">'+r.engine+'</span></div>'
  ).join('')+'</div>';
}
function pickSite(u) {
  // 点搜索结果 → 自动填详情页 URL 并提取集数
  const inp = document.getElementById('sniff-url');
  inp.value = u;
  sniffURL();
  toast('提取集数: '+u);
}

// ── 资源嗅探（盗版站集数）+ WebView 兜底 ──
async function sniffURL() {
  const u = document.getElementById('sniff-url').value.trim();
  if(!u) { toast('请输入详情页 URL', false); return; }
  const box = document.getElementById('sniff-eps');
  box.innerHTML = '<div class="dim">提取中…</div>';
  try {
    const r = await fetch('/api/sniff?url='+encodeURIComponent(u));
    const d = await r.json();
    if(d.ok) { renderEps(box, d.episodes||[]); toast('提取到 '+(d.episodes||[]).length+' 集'); return; }
    if(d.need_browser) {
      // JS 反爬：用 Android 壳 WebView 兜底（loadUrl 盗版站 → 拿 outerHTML → POST 回后端）
      box.innerHTML = '<div class="warn">检测到 JS 反爬，用 WebView 打开…</div>';
      if(window.hc && window.hc.sniffRender) {
        window.hc.sniffRender(u);
        pollSniffResult(box);
      } else {
        box.innerHTML = '<div class="warn">JS 反爬，需 App 内 WebView 兜底（桌面版不支持）。'+(d.msg||'')+'</div>';
      }
      return;
    }
    box.innerHTML = '<div class="warn">'+(d.msg||'提取失败')+'</div>';
  } catch(e) {
    box.innerHTML = '<div class="warn">网络错误: '+e.message+'</div>';
  }
}
function pollSniffResult(box) {
  let tries = 0;
  const iv = setInterval(async ()=>{
    tries++;
    try {
      const r = await fetch('/api/sniff/result');
      const d = await r.json();
      if(d.ok && d.episodes && d.episodes.length) {
        clearInterval(iv); renderEps(box, d.episodes); toast('WebView 提取到 '+d.episodes.length+' 集');
      } else if(tries > 40) { clearInterval(iv); box.innerHTML = '<div class="warn">WebView 提取超时</div>'; }
    } catch(e) { clearInterval(iv); box.innerHTML = '<div class="warn">轮询失败: '+e.message+'</div>'; }
  }, 1000);
}
function renderEps(box, eps) {
  box.innerHTML = '<div class="eps">'+eps.map(e=>
    '<div class="ep" onclick="copySniff(\''+e.url.replace(/'/g,"\\'")+'\')"><span class="epi">'+e.index+'</span><span class="ept">'+e.title+'</span><span class="epu">'+e.url+'</span></div>'
  ).join('')+'</div>';
}
function copySniff(u) {
  if(navigator.clipboard) navigator.clipboard.writeText(u);
  toast('已复制: '+u);
}

// ── 电视选择 ──
function selectTV(name) {
  toast('正在选择 '+name+'…');
  fetch('/api/tv/select?name='+encodeURIComponent(name)).then(r=>r.json()).then(d=>{
    if(d.ok) { toast('已选择 '+d.tv); goPage('home'); }
    else toast(d.msg||'选择失败', false);
    refresh();
  });
}

function rescan() {
  toast('扫描中…');
  fetch('/api/tv/scan').then(r=>r.json()).then(()=>{
    toast('扫描完成');
    refresh();
  });
}

// ── 工具 ──
function fmtBytes(n) {
  if(n < 1024) return n+' B';
  if(n < 1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? h+':'+p(m)+':'+p(s) : p(m)+':'+p(s);
}

// ── 控制 API ──
let curPaused = false;
function togglePlay() {
  // 乐观翻转本地状态，立即响应，电视回包后校准
  curPaused = !curPaused;
  document.getElementById('d-play').textContent = curPaused ? '▶' : '⏸';
  ctl(curPaused ? 'play' : 'pause');
}
function ctl(action, arg) {
  let url = '/api/play?action='+action;
  if(arg !== undefined) url += '&arg='+encodeURIComponent(arg);
  fetch(url).then(r=>r.json()).then(d=>{
    if(!d.ok) { toast(d.msg||'操作失败', false); pollPlay(); }  // 失败则回读真实状态
    else if(action==='volume') toast('音量 '+arg);
    else if(action==='play') toast('继续播放');
    else if(action==='pause') toast('已暂停');
    else pollPlay();
  }).catch(()=>toast('网络错误', false));
}

function volPreview(v) {
  document.getElementById('d-vol-num').textContent = v;
  document.getElementById('d-vol-ic').textContent = v==0?'🔇':(v<40?'🔉':'🔊');
}

// ── 操作台大进度条（拖动 seek）──
let seeking = false, seekPct = 0;
function seekPctFromEvent(e) {
  const el = document.getElementById('bigseek');
  const r = el.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return Math.max(0, Math.min(100, x / r.width * 100));
}
function initSeek() {
  const el = document.getElementById('bigseek');
  const start = e => {
    if(!curDuration) return;
    e.preventDefault(); seeking = true;
    seekPct = seekPctFromEvent(e);
    el.classList.add('dragging'); paintSeek(seekPct);
  };
  const move = e => {
    if(!seeking) return;
    e.preventDefault(); seekPct = seekPctFromEvent(e); paintSeek(seekPct);
  };
  const end = () => {
    if(!seeking) return;
    seeking = false; el.classList.remove('dragging');
    ctl('seek', Math.round(curDuration * seekPct / 100));
  };
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
}

let curDuration = 0;
function paintSeek(pct) {
  document.getElementById('bigseek-fill').style.width = pct+'%';
  document.getElementById('bigseek-knob').style.left = pct+'%';
}

function parseTVTime(s) {
  if(!s) return 0;
  s = String(s).trim();
  if(s.indexOf(':') >= 0) {
    const p = s.split(':').map(x=>parseInt(x,10)||0);
    if(p.length===3) return p[0]*3600+p[1]*60+p[2];
    if(p.length===2) return p[0]*60+p[1];
    return p[0]||0;
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

// ── 播放状态轮询（操作台 + 首页）──
let wasPlaying = false;
function pollPlay() {
  fetch('/api/play/status').then(r=>r.json()).then(d=>{
    const p = d.play || {};
    const playing = !!p.title || p.bytes > 0 || !!p.state;

    // 自动进操作台：首次检测到播放
    if(playing && !wasPlaying) goPage('dock');
    wasPlaying = playing;

    // 操作台
    const dock = document.getElementById('dock');
    const st = (p.state||'').toUpperCase();
    const isPaused = st === 'PAUSED_PLAYBACK' || st === 'PAUSED_RECORDING';
    const isLive = st === 'PLAYING' || st === 'TRANSITIONING';
    // 仅在电视明确返回 state 时校准（未选电视/无 state 时保留乐观状态）
    if(p.state) curPaused = isPaused;

    document.getElementById('d-play').textContent = curPaused ? '▶' : '⏸';
    document.getElementById('dock-live').textContent = isPaused ? 'PAUSED' : 'LIVE';
    document.getElementById('dock-live').style.background = isPaused ? 'var(--warn)' : 'var(--acc)';
    document.getElementById('dock-title').textContent = p.title || '播放中';

    let dur = 0, cur = 0;
    const tvDur = parseTVTime(p.duration), tvPos = parseTVTime(p.position);
    if(tvDur > 0) { dur = tvDur; cur = tvPos; }
    else { dur = p.total || 0; cur = p.elapsed || 0; }
    curDuration = dur;

    if(!seeking) {
      const pct = dur > 0 ? Math.max(0, Math.min(100, cur/dur*100)) : (p.percent||0);
      paintSeek(pct);
    }
    document.getElementById('d-cur').textContent = fmtTime(cur);
    document.getElementById('d-dur').textContent = dur > 0 ? fmtTime(dur) : '--:--';
    document.getElementById('d-bytes').textContent = fmtBytes(p.pos_bytes||0);
    document.getElementById('d-speed').textContent = p.speed > 0 ? p.speed.toFixed(0)+' KB/s' : '—';
    document.getElementById('d-pos').textContent = (p.percent||0).toFixed(0)+'%';

    if(p.volume !== undefined && p.volume !== '' && !volDragging) {
      const v = parseInt(p.volume,10);
      if(!isNaN(v)) { document.getElementById('d-vol').value = v; volPreview(v); }
    }

    // 首页小卡
    document.getElementById('st-playing').textContent = p.title || '—';
    document.getElementById('st-playing').className = 'sv ' + (playing?'ok':'dim');
    document.getElementById('st-speed').textContent = p.speed > 0 ? p.speed.toFixed(0)+' KB/s' : '—';
  }).catch(()=>{});
}
let volDragging = false;

// ── 状态刷新 ──
function refresh() {
  fetch('/api/status').then(r=>r.json()).then(d=>{
    const s = d.status;

    // tv
    const tvEl = document.getElementById('st-tv');
    if(s.tv) { tvEl.textContent = s.tv; tvEl.className='sv ok'; }
    else { tvEl.textContent = '未选择'; tvEl.className='sv warn'; }

    // 首页 hero
    const heroT = document.getElementById('hero-t');
    const heroS = document.getElementById('hero-s');
    const heroB = document.getElementById('hero-badge');
    const heroI = document.getElementById('hero-ic');
    if(s.ses_title) {
      heroI.textContent = '📺';
      heroT.textContent = s.ses_title;
      heroS.textContent = '正在投屏到 ' + (s.tv || '电视');
      heroB.textContent = '● 播放中'; heroB.className = 'hero-badge live';
    } else if(s.tv) {
      heroI.textContent = '✅';
      heroT.textContent = '已选电视';
      heroS.textContent = s.tv + ' · 等 B站投屏';
      heroB.textContent = '● 就绪'; heroB.className = 'hero-badge live';
    } else {
      heroI.textContent = '📡';
      heroT.textContent = '等待投屏';
      heroS.textContent = '打开 B站 App → 投屏 → 选「HomeCast Relay」';
      heroB.textContent = '● 接收端在线'; heroB.className = 'hero-badge idle';
    }

    document.getElementById('dock-sub').textContent = '目标电视：' + (s.tv || '未选择');

    // err
    const ew = document.getElementById('errbar');
    if(s.last_err) { ew.textContent = s.last_err; ew.classList.remove('hidden'); }
    else ew.classList.add('hidden');

    renderBubbles(d.tvs||[], s.tv, s.ses_title);
  }).catch(()=>{});
}

function renderBubbles(tvs, selected, playingTitle) {
  const el = document.getElementById('bubbles');
  const selfs = tvs.filter(t => t.name === SELF_NAME || t.udn.includes('relay'));
  const realTVs = tvs.filter(t => !selfs.includes(t));

  let html = '';
  html += '<div class="bub" style="cursor:default">'+
    '<span class="bub-tag self">本机</span>'+
    '<div class="bub-ic self">'+(playingTitle?'📡':'📢')+'</div>'+
    '<div class="bub-name">HomeCast Relay</div>'+
    '<div class="bub-ip">'+(playingTitle?'正在中继':'等待投屏')+'</div>'+
  '</div>';

  if(realTVs.length) {
    realTVs.forEach(t => {
      const sel = t.name === selected;
      html += '<div class="bub'+(sel?' on':'')+'" onclick="selectTV(\''+t.name.replace(/'/g,"")+'\')">'+
        (sel?'<span class="bub-tag on">已选</span>':'')+
        '<div class="bub-ic tv">📺</div>'+
        '<div class="bub-name">'+t.name+'</div>'+
        '<div class="bub-ip">'+t.ip+':'+t.port+'</div>'+
      '</div>';
    });
  }

  if(!realTVs.length) {
    html += '<div class="bub-empty" style="grid-column:auto">'+
      '未发现电视<br>点「重新扫描」试试<br><span style="font-size:9px">电视需与本程序同网段</span></div>';
  }

  el.innerHTML = html;
}

// ── 日志 ──
let lastLogs = [];
async function pollLogs() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const el = document.getElementById('logs');
    const logs = d.logs || [];
    if(JSON.stringify(logs) !== JSON.stringify(lastLogs)) {
      lastLogs = logs;
      el.innerHTML = logs.map(l=>'<div>'+l.replace(/</g,'&lt;')+'</div>').join('');
      el.scrollTop = el.scrollHeight;
    }
  } catch(e){}
}

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', () => {
  initSeek();
  const v = document.getElementById('d-vol');
  v.addEventListener('pointerdown', ()=>volDragging=true);
  window.addEventListener('pointerup', ()=>volDragging=false);
});

// 统一轮询
setInterval(()=>{ refresh(); pollPlay(); }, 1000);
setInterval(pollLogs, 2500);
refresh(); pollPlay(); pollLogs();
</script>
