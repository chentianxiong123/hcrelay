<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HomeCast 中继</title>
  <script src="/assets/htmx.min.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --fg:#e6e8ec; --dim:#8b93a3; --acc:#ff5c8a; --ok:#3ddc84; }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif; padding:16px; max-width:560px; margin:0 auto; }
    h1 { font-size:19px; margin-bottom:4px; }
    .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
    .card h2 { font-size:14px; color:var(--dim); font-weight:600; margin-bottom:10px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
    .btn { border:0; border-radius:12px; padding:10px 14px; font-size:14px; cursor:pointer; background:var(--acc); color:#fff; font-weight:600; }
    .btn.ghost { background:var(--line); color:var(--fg); }
    .btn.ok { background:var(--ok); color:#06240f; }
    .btn.sm { padding:6px 10px; font-size:12px; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .tv { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
    .tv .name { font-weight:600; }
    .tv .meta { color:var(--dim); font-size:11px; }
    .mode { display:flex; gap:8px; margin-bottom:10px; }
    .mode label { flex:1; text-align:center; padding:8px; border:1px solid var(--line); border-radius:10px; font-size:13px; color:var(--dim); cursor:pointer; }
    .mode input { display:none; }
    .mode input:checked + span { color:var(--acc); font-weight:700; }
    .stat { font-size:13px; }
    .stat b { color:var(--ok); }
    .logs { font-family:ui-monospace,monospace; font-size:11px; color:var(--dim); max-height:160px; overflow:auto; white-space:pre-wrap; }
    .err { color:#ff7a7a; }
    .pulse { animation:pulse 1.2s infinite; }
    @keyframes pulse { 50%{opacity:.5} }
  </style>
</head>
<body>
  <h1>HomeCast 中继</h1>
  <div class="sub">B站 → 本机 → 电视 · {{.BaseURL}}</div>

  <div class="card">
    <h2>播放模式</h2>
    <div class="mode">
      <label><input type="radio" name="mode" value="proxy" hx-get="/api/mode" hx-vals='{"mode":"proxy"}' hx-target="#toast" hx-swap="innerHTML"><span>直连代理</span></label>
      <label><input type="radio" name="mode" value="remux" checked hx-get="/api/mode" hx-vals='{"mode":"remux"}' hx-target="#toast" hx-swap="innerHTML"><span>重封装(推荐)</span></label>
      <label><input type="radio" name="mode" value="hls" hx-get="/api/mode" hx-vals='{"mode":"hls"}' hx-target="#toast" hx-swap="innerHTML"><span>HLS修复</span></label>
    </div>
    <div id="toast"></div>
  </div>

  <div id="status">
    {{template "status.html" .}}
  </div>

  <div class="card">
    <h2>日志</h2>
    <div class="logs" id="logs" hx-get="/hx/logs" hx-trigger="every 2s" hx-swap="innerHTML" hx-target="#logs">
      {{template "logs.html" .}}
    </div>
  </div>

  <script>
    setInterval(() => {
      htmx.ajax('GET', '/hx/status', {target:'#status', swap:'innerHTML'});
    }, 2500);
  </script>
</body>
</html>
